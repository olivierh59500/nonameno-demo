plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh.nonameno"
    compileSdk 36

    defaultConfig {
        applicationId "com.olivierh.nonameno"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // The validated development target is an arm64 Pixel and the guide
        // deliberately pins this compatible Gradle/AGP toolchain.
        disable += ["AndroidGradlePluginVersion", "ChromeOsAbiSupport"]
    }
}

dependencies {
    implementation files("libs/nonameno.aar")
}
